[env:exp07a_pb0]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
upload_flags =
    -c
    set CPUTAPID 0
build_flags = -DPWM_OUT=PWM_OUT_PB0
build_src_filter = -<*> +<exp07a_led_pattern/>
